/* Layout: Beamer-Tafel (Spuren oben, Sitzordnung, Protokoll rechts) · Handy-Ansicht als Stapel */
:root {
  --bg: #e7eae6; --paper: #f6f7f4; --ink: #1c2124; --muted: #5d676b; --line: #c9cfcb;
  --lib: #2c6491; --lib-soft: #d6e4ef; --fas: #ad2f29; --fas-soft: #f2d9d6;
  --gold: #b9861c; --gold-soft: #f1e3c2; --ok: #2f7a4b; --shadow: 0 1px 0 rgba(0,0,0,.05), 0 6px 18px rgba(20,30,35,.08);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Public Sans", Arial, Helvetica, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121618; --paper: #1b2124; --ink: #e5e8e4; --muted: #98a3a6; --line: #313a3e;
  --lib: #6aa5d8; --lib-soft: #1d3141; --fas: #e2675f; --fas-soft: #3d2120; --gold: #e0b04a; --gold-soft: #3a3020; --ok: #63b884;
  --shadow: 0 1px 0 rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121618; --paper: #1b2124; --ink: #e5e8e4; --muted: #98a3a6; --line: #313a3e;
  --lib: #6aa5d8; --lib-soft: #1d3141; --fas: #e2675f; --fas-soft: #3d2120; --gold: #e0b04a; --gold-soft: #3a3020; --ok: #63b884;
  --shadow: 0 1px 0 rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0 }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
#app { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: .01em; line-height: 1.05; margin: 0; text-wrap: balance; text-transform: uppercase }
h1 { font-size: clamp(2.2rem, 6vw, 3.6rem) } h2 { font-size: 1.6rem } h3 { font-size: 1.15rem; letter-spacing: .04em }
p { margin: 0 }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700 }
.muted { color: var(--muted) }
.stack { display: flex; flex-direction: column; gap: 14px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 18px; box-shadow: var(--shadow); min-width: 0 }
button { font: inherit; cursor: pointer; border-radius: 4px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); padding: 10px 16px; font-weight: 700 }
button:hover:not(:disabled) { background: var(--ink); color: var(--paper) }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
button:disabled { opacity: .4; cursor: not-allowed }
button.primary { background: var(--ink); color: var(--paper) }
button.primary:hover:not(:disabled) { background: var(--gold); border-color: var(--gold); color: #1c2124 }
button.big { font-family: var(--f-display); font-size: 1.5rem; text-transform: uppercase; letter-spacing: .04em; padding: 12px 22px }
button.ghost { border-color: var(--line); font-weight: 500 }
button.ja { background: var(--paper); border-color: var(--ok); color: var(--ok); font-family: var(--f-display); font-size: 2.4rem; flex: 1; min-width: 120px; padding: 18px }
button.nein { background: var(--paper); border-color: var(--fas); color: var(--fas); font-family: var(--f-display); font-size: 2.4rem; flex: 1; min-width: 120px; padding: 18px }
button.ja:hover:not(:disabled) { background: var(--ok); color: var(--paper) } button.nein:hover:not(:disabled) { background: var(--fas); color: var(--paper) }
button.sel.ja { background: var(--ok); color: var(--paper) } button.sel.nein { background: var(--fas); color: var(--paper) }
input[type=text] { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); min-width: 0; width: 100% }
.code { font-family: var(--f-mono); font-weight: 700; letter-spacing: .18em }
.note { font-size: .9rem; border-left: 3px solid var(--gold); padding: 6px 12px; background: var(--gold-soft) }
.err { border-left-color: var(--fas); background: var(--fas-soft) }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden }
.seg button { border: 0; border-radius: 0; font-weight: 500 } .seg button.on { background: var(--ink); color: var(--paper) }

/* Kopf */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 3px double var(--ink) }
.top .sub { font-size: .85rem; color: var(--muted) }
.joincode { text-align: right } .joincode .code { font-size: clamp(1.8rem, 4vw, 2.8rem); line-height: 1 }

/* Spuren */
.board { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start }
@media (max-width: 900px) { .board { grid-template-columns: minmax(0, 1fr) } }
.track { border-radius: 6px; padding: 14px; border: 2px solid currentColor }
.track.lib { color: var(--lib); background: var(--lib-soft) } .track.fas { color: var(--fas); background: var(--fas-soft) }
.track h3 { margin-bottom: 10px }
.slots { display: grid; gap: 8px }
.slots.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: 560px } .slots.n6 { grid-template-columns: repeat(6, minmax(0, 1fr)); max-width: 672px }
.slot { aspect-ratio: 5 / 7; max-width: 100%; border: 1.5px dashed currentColor; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px; font-size: .68rem; line-height: 1.15; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .85; position: relative }
.slot .pw { font-size: 1.4rem; line-height: 1; margin-bottom: 4px; font-family: var(--f-display) }
.slot.win { border-style: solid }
.card { aspect-ratio: 5 / 7; max-width: 100%; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: var(--f-display); font-weight: 900; text-transform: uppercase; box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); padding: 4px; text-align: center }
.card.L { background: var(--lib) } .card.F { background: var(--fas) }
.card .glyph { font-size: 2.2rem; line-height: 1 } .card small { font-size: .62rem; letter-spacing: .08em; font-family: var(--f-body); font-weight: 700 }
.slot .card { position: absolute; inset: -1px; aspect-ratio: auto }
.tracker { display: flex; align-items: center; gap: 14px; flex-wrap: wrap }
.dots { display: flex; gap: 8px } .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted) } .dot.on { background: var(--gold); border-color: var(--gold) }
.piles { font-family: var(--f-mono); font-size: .85rem; color: var(--muted) }

/* Status */
.status { background: var(--ink); color: var(--paper); border-radius: 6px; padding: 16px 18px }
.status .lbl { color: var(--gold) }
.status p { font-size: 1.25rem; font-weight: 700 }

/* Sitzordnung */
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.seat { border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--paper); min-width: 0; position: relative }
.seat .nm { font-weight: 700; overflow-wrap: anywhere }
.seat.dead { opacity: .45; text-decoration: line-through }
.seat.act { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 22px }
.b { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted) }
.b.pres { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.b.chan { background: var(--gold); color: #1c2124; border-color: var(--gold) }
.b.ja { color: var(--ok); border-color: var(--ok) } .b.nein { color: var(--fas); border-color: var(--fas) }
.b.L { background: var(--lib); color: #fff; border-color: var(--lib) } .b.F, .b.H { background: var(--fas); color: #fff; border-color: var(--fas) }

/* Protokoll */
.log { max-height: 520px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: .9rem }
.log div { padding-left: 10px; border-left: 3px solid var(--line) }
.log .round { border-left-color: var(--ink); font-weight: 700; margin-top: 6px }
.log .lib { border-left-color: var(--lib) } .log .fas { border-left-color: var(--fas) } .log .ok { border-left-color: var(--ok) } .log .no { border-left-color: var(--muted) } .log .win { border-left-color: var(--gold); font-weight: 700 }

/* Spieler:innen-Ansicht */
.phone { max-width: 560px; margin: 0 auto }
.role { border-radius: 6px; padding: 18px; color: #fff; text-align: center }
.role.L { background: var(--lib) } .role.F, .role.H { background: var(--fas) }
.role .big { font-family: var(--f-display); font-size: 3rem; font-weight: 900; text-transform: uppercase; line-height: 1 }
.role p { margin-top: 8px }
.cover { border: 2px dashed var(--line); border-radius: 6px; padding: 26px; text-align: center }
.hand { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.hand.two { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.hand button { padding: 0; border: 0; background: none; border-radius: 6px }
.hand button:hover .card { outline: 4px solid var(--gold) }
.hand button:hover:not(:disabled) { background: none }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px }
.picks button { text-align: left; font-weight: 600 }
.picks small { display: block; font-weight: 400; font-size: .72rem; color: var(--muted) }
.mini .slots { gap: 4px } .mini .slot { font-size: .5rem } .mini .slot .pw { font-size: .9rem } .mini .card .glyph { font-size: 1.2rem } .mini .card small { display: none } .mini .track { padding: 8px } .mini .track h3 { font-size: .9rem; margin-bottom: 6px }
.reflect ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; max-width: 70ch }
.reveal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.home { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px }
footer { margin-top: 32px; font-size: .78rem; color: var(--muted); max-width: 80ch }
@media (prefers-reduced-motion: no-preference) { .status, .role, .card { animation: in .25s ease-out } @keyframes in { from { transform: translateY(4px); opacity: .6 } } }

<div id="app"></div>

<script>
// ===== Spiel-Engine (rein, ohne DOM) =====
const TERMS = {
  orig: { title: 'Secret Hitler', L: 'Liberale', F: 'Faschisten', Ls: 'Liberal', Fs: 'Faschist', H: 'Hitler', polL: 'liberales Gesetz', polF: 'faschistisches Gesetz', trackL: 'Liberale Gesetze', trackF: 'Faschistische Gesetze' },
  neutral: { title: 'Geheimer Diktator', L: 'Demokrat:innen', F: 'Autokrat:innen', Ls: 'Demokratisch', Fs: 'Autokratisch', H: 'Diktator:in', polL: 'demokratisches Gesetz', polF: 'autoritäres Gesetz', trackL: 'Demokratische Gesetze', trackF: 'Autoritäre Gesetze' }
};
const T = s => TERMS[(s && s.terms) || 'orig'] || TERMS.orig;
const POWERS = {
  5: [null, null, 'peek', 'kill', 'kill', null],
  6: [null, null, 'peek', 'kill', 'kill', null],
  7: [null, 'investigate', 'special', 'kill', 'kill', null],
  8: [null, 'investigate', 'special', 'kill', 'kill', null],
  9: ['investigate', 'investigate', 'special', 'kill', 'kill', null],
  10: ['investigate', 'investigate', 'special', 'kill', 'kill', null]
};
const ROLECOUNT = { 5: [3, 1], 6: [4, 1], 7: [4, 2], 8: [5, 2], 9: [5, 3], 10: [6, 3] };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function newGame(code, hostId, terms) {
  return {
    v: 1, code, hostId, terms: terms || 'orig', phase: 'lobby',
    players: [], presIdx: -1, chanIdx: -1, lastPres: -1, lastChan: -1, specialReturn: null,
    deck: [], discard: [], hand: [], lib: 0, fas: 0, tracker: 0,
    votes: {}, lastVote: null, power: null, vetoDenied: false,
    secret: {}, seenRole: {}, log: [], winner: null, winReason: '', seen: {},
    stats: { rounds: 0, failed: 0, chaos: 0, vetos: 0 }, n0: 0
  };
}

const alive = s => s.players.map((p, i) => i).filter(i => s.players[i].alive);
const idxOf = (s, pid) => s.players.findIndex(p => p.id === pid);
function nextAlive(s, from) {
  const n = s.players.length;
  for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (s.players[i].alive) return i; }
  return from;
}
function canBeChancellor(s, i) {
  const p = s.players[i];
  if (!p || !p.alive || i === s.presIdx) return false;
  if (i === s.lastChan) return false;
  if (alive(s).length > 5 && i === s.lastPres) return false;
  return true;
}
function log(s, text, kind) { s.log.push({ text, kind: kind || '' }); if (s.log.length > 80) s.log.shift(); }
function addSecret(s, pid, msg) { (s.secret[pid] = s.secret[pid] || []).push(msg); }

function startGame(s) {
  const n = s.players.length;
  if (n < 5 || n > 10) throw new Error('5 bis 10 Spieler:innen nötig.');
  const [L, F] = ROLECOUNT[n];
  const roles = shuffle(Array(L).fill('L').concat(Array(F).fill('F'), ['H']));
  s.players = shuffle(s.players).map((p, i) => ({ ...p, role: roles[i], alive: true, investigated: false }));
  s.n0 = n;
  s.deck = shuffle(Array(6).fill('L').concat(Array(11).fill('F')));
  s.discard = []; s.hand = [];
  s.presIdx = Math.floor(Math.random() * n);
  s.phase = 'roles'; s.seenRole = {};
  log(s, 'Rollen wurden verteilt. Alle schauen sich geheim ihre Rolle an.');
}

function beginRounds(s) {
  s.phase = 'nominate'; s.chanIdx = -1; s.stats.rounds = 1;
  log(s, `Runde 1: ${s.players[s.presIdx].name} ist Präsident:in.`, 'round');
}

function nextRound(s) {
  if (s.specialReturn != null) { s.presIdx = nextAlive(s, s.specialReturn); s.specialReturn = null; }
  else s.presIdx = nextAlive(s, s.presIdx);
  s.chanIdx = -1; s.votes = {}; s.hand = []; s.power = null; s.vetoDenied = false;
  s.phase = 'nominate'; s.stats.rounds++;
  log(s, `Runde ${s.stats.rounds}: ${s.players[s.presIdx].name} ist Präsident:in.`, 'round');
}

function reshuffleIfNeeded(s) {
  if (s.deck.length < 3) {
    s.deck = shuffle(s.deck.concat(s.discard)); s.discard = [];
    log(s, 'Der Gesetzesstapel wurde mit dem Ablagestapel neu gemischt.');
  }
}

function win(s, team, reason) { s.winner = team; s.winReason = reason; s.phase = 'over'; log(s, reason, 'win'); }

function enact(s, card, chaos) {
  if (card === 'L') s.lib++; else s.fas++;
  log(s, chaos ? `Chaos! Das oberste Gesetz wird erlassen: ${card === 'L' ? T(s).polL : T(s).polF}.` : `Erlassen: ${card === 'L' ? T(s).polL : T(s).polF}.`, card === 'L' ? 'lib' : 'fas');
  s.tracker = 0;
  if (s.lib >= 5) return win(s, 'L', 'LIB_POLICIES');
  if (s.fas >= 6) return win(s, 'F', 'FAS_POLICIES');
  reshuffleIfNeeded(s);
  if (chaos) { s.lastPres = -1; s.lastChan = -1; s.stats.chaos++; return nextRound(s); }
  const pw = card === 'F' ? POWERS[s.n0][s.fas - 1] : null;
  if (pw) {
    s.power = pw; s.phase = 'power';
    if (pw === 'peek') addSecret(s, s.players[s.presIdx].id, { type: 'peek', cards: s.deck.slice(0, 3), round: s.stats.rounds });
    return;
  }
  nextRound(s);
}

function failElection(s) {
  s.tracker++; s.stats.failed++;
  if (s.tracker >= 3) {
    reshuffleIfNeeded(s);
    const c = s.deck.shift();
    enact(s, c, true);
  } else nextRound(s);
}

// Aktion anwenden. Gibt Fehlertext zurück oder null.
function apply(s, pid, a) {
  const me = idxOf(s, pid);
  const isPres = me >= 0 && me === s.presIdx;
  const isChan = me >= 0 && me === s.chanIdx;
  switch (a.type) {
    case 'join': {
      if (s.phase !== 'lobby') return 'Das Spiel läuft schon.';
      const name = String(a.name || '').trim().slice(0, 18);
      if (!name) return 'Name fehlt.';
      if (me >= 0) { s.players[me].name = name; return null; }
      if (s.players.length >= 10) return 'Das Spiel ist voll (max. 10).';
      s.players.push({ id: pid, name, alive: true });
      return null;
    }
    case 'leave': {
      if (s.phase !== 'lobby' || me < 0) return null;
      s.players.splice(me, 1); return null;
    }
    case 'seen': { if (s.phase === 'roles' && me >= 0) s.seenRole[pid] = true; return null; }
    case 'nominate': {
      if (s.phase !== 'nominate' || !isPres) return 'Nicht an der Reihe.';
      if (!canBeChancellor(s, a.target)) return 'Diese Person kann nicht nominiert werden.';
      s.chanIdx = a.target; s.votes = {}; s.phase = 'vote';
      log(s, `${s.players[me].name} nominiert ${s.players[a.target].name} als Kanzler:in.`);
      return null;
    }
    case 'vote': {
      if (s.phase !== 'vote' || me < 0 || !s.players[me].alive) return 'Keine Abstimmung.';
      s.votes[pid] = !!a.ja;
      const al = alive(s);
      if (al.every(i => s.votes[s.players[i].id] !== undefined)) {
        const ja = al.filter(i => s.votes[s.players[i].id]).length;
        const passed = ja > al.length / 2;
        s.lastVote = { pres: s.presIdx, chan: s.chanIdx, votes: { ...s.votes }, passed, ja, nein: al.length - ja, round: s.stats.rounds };
        log(s, `Wahl ${passed ? 'angenommen' : 'abgelehnt'} (${ja} Ja : ${al.length - ja} Nein).`, passed ? 'ok' : 'no');
        if (passed) {
          s.lastPres = s.presIdx; s.lastChan = s.chanIdx;
          if (s.fas >= 3 && s.players[s.chanIdx].role === 'H') return win(s, 'F', 'H_ELECTED'), null;
          if (s.fas >= 3) log(s, `${s.players[s.chanIdx].name} ist nicht ${T(s).H}.`);
          reshuffleIfNeeded(s);
          s.hand = s.deck.splice(0, 3); s.phase = 'pres_discard';
        } else failElection(s);
      }
      return null;
    }
    case 'discard': {
      if (s.phase !== 'pres_discard' || !isPres) return 'Nicht an der Reihe.';
      const i = a.i; if (!(i >= 0 && i < s.hand.length)) return 'Ungültige Karte.';
      s.discard.push(s.hand.splice(i, 1)[0]); s.phase = 'chan_enact';
      log(s, 'Präsident:in gibt zwei Gesetze an die Kanzlerschaft weiter.');
      return null;
    }
    case 'enact': {
      if (s.phase !== 'chan_enact' || !isChan) return 'Nicht an der Reihe.';
      const i = a.i; if (!(i >= 0 && i < s.hand.length)) return 'Ungültige Karte.';
      const c = s.hand.splice(i, 1)[0]; s.discard.push(...s.hand); s.hand = [];
      enact(s, c, false); return null;
    }
    case 'veto_request': {
      if (s.phase !== 'chan_enact' || !isChan || s.fas < 5 || s.vetoDenied) return 'Veto nicht möglich.';
      s.phase = 'veto'; log(s, `${s.players[me].name} schlägt ein Veto vor.`); return null;
    }
    case 'veto_answer': {
      if (s.phase !== 'veto' || !isPres) return 'Nicht an der Reihe.';
      if (a.ok) {
        s.discard.push(...s.hand); s.hand = []; s.stats.vetos++;
        log(s, 'Veto angenommen. Beide Gesetze werden abgelegt.', 'no');
        failElection(s);
      } else { s.vetoDenied = true; s.phase = 'chan_enact'; log(s, 'Veto abgelehnt. Die Kanzlerschaft muss ein Gesetz erlassen.'); }
      return null;
    }
    case 'peek_done': {
      if (s.phase !== 'power' || s.power !== 'peek' || !isPres) return 'Nicht an der Reihe.';
      log(s, `${s.players[me].name} hat die obersten drei Gesetze angesehen.`); nextRound(s); return null;
    }
    case 'investigate': {
      if (s.phase !== 'power' || s.power !== 'investigate' || !isPres) return 'Nicht an der Reihe.';
      const t = s.players[a.target];
      if (!t || !t.alive || a.target === me || t.investigated) return 'Diese Person kann nicht untersucht werden.';
      t.investigated = true;
      addSecret(s, pid, { type: 'inv', target: a.target, party: t.role === 'L' ? 'L' : 'F', round: s.stats.rounds });
      log(s, `${s.players[me].name} untersucht die Parteizugehörigkeit von ${t.name}.`);
      nextRound(s); return null;
    }
    case 'special': {
      if (s.phase !== 'power' || s.power !== 'special' || !isPres) return 'Nicht an der Reihe.';
      const t = s.players[a.target];
      if (!t || !t.alive || a.target === me) return 'Ungültige Wahl.';
      log(s, `Sonderwahl: ${s.players[me].name} bestimmt ${t.name} als nächste:n Präsident:in.`);
      s.specialReturn = me; s.presIdx = a.target; s.chanIdx = -1; s.votes = {}; s.hand = []; s.power = null;
      s.vetoDenied = false; s.phase = 'nominate'; s.stats.rounds++;
      log(s, `Runde ${s.stats.rounds}: ${t.name} ist Präsident:in.`, 'round');
      return null;
    }
    case 'kill': {
      if (s.phase !== 'power' || s.power !== 'kill' || !isPres) return 'Nicht an der Reihe.';
      const t = s.players[a.target];
      if (!t || !t.alive || a.target === me) return 'Ungültige Wahl.';
      t.alive = false;
      log(s, `${s.players[me].name} lässt ${t.name} hinrichten.`, 'fas');
      if (t.role === 'H') return win(s, 'L', 'H_KILLED'), null;
      nextRound(s); return null;
    }
  }
  return 'Unbekannte Aktion.';
}

// Wer muss gerade handeln? (für Anzeige und Ein-Gerät-Modus)
function actors(s) {
  switch (s.phase) {
    case 'roles': return s.players.filter(p => !s.seenRole[p.id]).map(p => p.id);
    case 'nominate': case 'pres_discard': case 'veto': case 'power': return [s.players[s.presIdx].id];
    case 'chan_enact': return [s.players[s.chanIdx].id];
    case 'vote': return alive(s).map(i => s.players[i].id).filter(id => s.votes[id] === undefined);
  }
  return [];
}

if (typeof module !== 'undefined' && module.exports) module.exports = { TERMS, newGame, apply, startGame, beginRounds, actors, canBeChancellor, POWERS };

const LS = { get(k) { try { return JSON.parse(localStorage.getItem('sh_' + k)) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem('sh_' + k, JSON.stringify(v)) } catch (e) {} } };
const PW = { peek: ['👁', 'Gesetze ansehen'], investigate: ['?', 'Gesinnung prüfen'], special: ['➜', 'Sonderwahl'], kill: ['✕', 'Hinrichtung'] };

// ===== Gemeinsame Bausteine =====
function tracks(s, mini) {
  const t = T(s), pw = POWERS[s.n0 || Math.max(5, Math.min(10, s.players.length))] || POWERS[5];
  let lib = '', fas = '';
  for (let i = 0; i < 5; i++) lib += `<div class="slot ${i === 4 ? 'win' : ''}">${i === 4 ? '<span class="pw">★</span>Sieg' : ''}${i < s.lib ? card('L', s) : ''}</div>`;
  for (let i = 0; i < 6; i++) {
    const p = pw[i]; let inner = i === 5 ? '<span class="pw">★</span>Sieg' : p ? `<span class="pw">${PW[p][0]}</span>${PW[p][1]}` : '';
    if (i === 4) inner += '<br>+ Veto';
    fas += `<div class="slot ${i === 5 ? 'win' : ''}">${inner}${i < s.fas ? card('F', s) : ''}</div>`;
  }
  return `<div class="stack ${mini ? 'mini' : ''}">
    <div class="track lib"><h3>${t.trackL}</h3><div class="slots n5">${lib}</div></div>
    <div class="track fas"><h3>${t.trackF}</h3><div class="slots n6">${fas}</div>
      ${mini ? '' : `<p style="margin-top:10px;font-size:.85rem;color:var(--ink)">Ab dem 3. ${t.polF}: Wird ${t.H} zur Kanzlerschaft gewählt, gewinnen die ${t.F}.</p>`}</div>
    <div class="tracker"><span class="lbl">Wahlticker</span><div class="dots">${[0, 1, 2].map(i => `<span class="dot ${i < s.tracker ? 'on' : ''}"></span>`).join('')}</div>
      <span class="piles">Stapel ${s.deck.length} · Ablage ${s.discard.length}</span></div>
  </div>`;
}
function card(c, s) { const t = T(s); return `<div class="card ${c}"><span class="glyph">${c === 'L' ? '◆' : '▲'}</span><small>${c === 'L' ? t.polL : t.polF}</small></div>`; }
const nm = (s, i) => i >= 0 && s.players[i] ? esc(s.players[i].name) : '–';

function statusText(s) {
  const t = T(s), P = nm(s, s.presIdx), C = nm(s, s.chanIdx);
  switch (s.phase) {
    case 'lobby': return [`Warten auf Mitspielende`, `${s.players.length} von mind. 5 sind dabei.`];
    case 'roles': return ['Rollen ansehen', `${Object.keys(s.seenRole).length} von ${s.players.length} haben ihre Rolle gesehen. Augen auf das eigene Gerät!`];
    case 'nominate': return [`Runde ${s.stats.rounds}`, `${P} nominiert eine Person für die Kanzlerschaft.`];
    case 'vote': { const al = s.players.filter(p => p.alive).length; return ['Abstimmung', `Regierung ${P} + ${C}? ${Object.keys(s.votes).length} von ${al} haben abgestimmt.`]; }
    case 'pres_discard': return ['Gesetzgebung', `${P} zieht drei Gesetze und legt eines verdeckt ab.`];
    case 'chan_enact': return ['Gesetzgebung', `${C} wählt aus zwei Gesetzen eines aus.${s.vetoDenied ? ' (Veto abgelehnt)' : ''}`];
    case 'veto': return ['Veto', `${C} schlägt ein Veto vor. ${P} entscheidet.`];
    case 'power': return ['Präsidiale Sondermacht', `${P}: ${PW[s.power][1]}.`];
    case 'over': return ['Spielende', winText(s)];
  }
  return ['', ''];
}
function winText(s) {
  const t = T(s);
  return { LIB_POLICIES: `Die ${t.L} haben fünf Gesetze erlassen und gewinnen.`, FAS_POLICIES: `Die ${t.F} haben sechs Gesetze erlassen und gewinnen.`, H_ELECTED: `${t.H} wurde zur Kanzlerschaft gewählt. Die ${t.F} gewinnen.`, H_KILLED: `${t.H} wurde hingerichtet. Die ${t.L} gewinnen.` }[s.winReason] || '';
}

    if (i === s.presIdx && s.phase !== 'lobby') b.push('<span class="b pres">Präs.</span>');

}

    <div class="board"><div class="stack">
      <div class="status"><span class="lbl">${h}</span><p>${txt}</p>${s.lastVote && s.phase !== 'vote' && s.phase !== 'over' && s.lastVote.round >= s.stats.rounds - 1 ? `<p style="font-size:.9rem;font-weight:500;margin-top:4px;opacity:.8">Letzte Wahl: ${s.lastVote.ja} Ja · ${s.lastVote.nein} Nein</p>` : ''}</div>
      ${app.msg ? `<p class="note err">${esc(app.msg)}</p>` : ''}
      ${hand}${ctrl}
      ${s.phase === 'lobby' ? '' : tracks(s)}
      <div class="stack"><span class="lbl">${s.phase === 'lobby' ? 'Beigetreten' : 'Sitzordnung (im Uhrzeigersinn)'}</span>${s.players.length ? seats(s, { kick: s.phase === 'lobby' && !local }) : '<p class="muted">Noch niemand. Code oben eingeben lassen.</p>'}</div>
      ${s.phase === 'over' ? reflection(s) + `<div class="row"><button class="primary" data-a="again">Neue Runde, gleiche Leute</button><button class="ghost" data-a="quit">Zur Startseite</button></div>` : ''}
    </div>
    <aside class="panel stack"><span class="lbl">Protokoll</span>${s.log.length ? logView(s) : '<p class="muted">Noch keine Ereignisse.</p>'}
      ${s.phase !== 'over' && s.phase !== 'lobby' ? `<button class="ghost" data-a="quit" style="margin-top:8px">Spiel abbrechen</button>` : ''}</aside>
    </div>`;
}

// ===== Spieler:innen-Ansicht =====
function roleBox(s, me) {
  const t = T(s), p = s.players[me];
  const fas = s.players.filter(x => x.role === 'F' && x.id !== p.id).map(x => esc(x.name));
  const hit = s.players.find(x => x.role === 'H');
  let title, info;
  if (p.role === 'L') { title = t.Ls; info = `Du gehörst zu den ${t.L}. Erlasst fünf ${t.polL.replace('es Gesetz', 'e Gesetze')} oder findet und beseitigt ${t.H}.`; }
  else if (p.role === 'F') { title = t.Fs; info = `${fas.length ? 'Deine Verbündeten: <b>' + fas.join(', ') + '</b>. ' : ''}${t.H} ist <b>${esc(hit.name)}</b>. Bringt ${t.H} nach drei ${t.polF.replace('es Gesetz', 'en Gesetzen')} an die Kanzlerschaft.`; }
  else { title = t.H; info = s.n0 <= 6 ? `Deine Verbündeten: <b>${fas.join(', ')}</b>.` : `Du kennst deine Verbündeten nicht, aber sie kennen dich. Wirke vertrauenswürdig.`; }
  return `<div class="role ${p.role}"><span class="lbl" style="color:#fff;opacity:.8">Geheime Rolle · Partei: ${p.role === 'L' ? t.Ls : t.Fs}</span><div class="big">${title}</div><p>${info}</p></div>`;
}

function playerView(s, pid) {
  const me = idxOf(s, pid), t = T(s), local = !!app.handTo;
  const [h, txt] = statusText(s);
  const head = `<header class="top"><div><span class="lbl">${local ? 'Geheime Ansicht' : 'Spiel ' + s.code}</span><h1 style="font-size:2.2rem">${me >= 0 ? esc(s.players[me].name) : t.title}</h1></div>
    ${local ? `<button class="primary" data-a="cover">${app.mode === 'local' ? 'Verdecken &amp; zurückgeben' : 'Zurück zur Tafel'}</button>` : ''}</header>`;
  const pending = (!local && app.n > (s.seen[pid] || 0) ? '<p class="note">Wird übertragen …</p>' : '') + (!local ? ({ wait: '<p class="note">Verbinde mit der Tafel …</p>', nohost: '<p class="note err">Tafel nicht erreichbar. Läuft das Spiel auf dem Beamer-Rechner? Neuer Versuch läuft …</p>', lost: '<p class="note err">Verbindung unterbrochen. Neuer Versuch läuft …</p>', err: '<p class="note err">Keine Internetverbindung zum Vermittlungsserver. Neuer Versuch läuft …</p>' }[app.net] || '') + (app.msg ? `<p class="note err">${esc(app.msg)}</p>` : '') : '');
  if (me < 0) {
    if (s.phase !== 'lobby') return `<div class="phone stack">${head}<div class="panel"><p>Dieses Spiel läuft bereits ohne dich.</p><button class="ghost" data-a="quit" style="margin-top:12px">Zur Startseite</button></div></div>`;
    return `<div class="phone stack">${head}<div class="panel stack">${pending}<p>Verbinde mit Spiel <b class="code">${s.code}</b> …</p><p class="muted">Die Tafel muss auf dem Beamer-Rechner geöffnet sein.</p><button class="ghost" data-a="quit">Abbrechen</button></div></div>`;
  }
  const p = s.players[me], isPres = me === s.presIdx, isChan = me === s.chanIdx;
  let action = '';
  const err = s.err && s.err.pid === pid && s.err.n === app.n ? `<p class="note err">${esc(s.err.text)}</p>` : '';
  if (s.phase === 'lobby') action = `<div class="panel stack"><p>Du bist dabei. Warte, bis die Spielleitung startet.</p><p class="muted">${s.players.length} Mitspielende.</p><button class="ghost" data-a="leave">Austreten</button></div>`;
  else if (s.phase === 'over') action = `<div class="panel stack"><h2>${s.winner === (p.role === 'L' ? 'L' : 'F') ? 'Gewonnen!' : 'Verloren.'}</h2><p>${winText(s)}</p></div>${reflection(s)}`;
  else if (!p.alive) action = `<div class="panel"><h2>Du wurdest hingerichtet.</h2><p class="muted" style="margin-top:6px">Du darfst nicht mehr sprechen, abstimmen oder verraten, wer du warst.</p></div>`;
  else if (s.phase === 'roles') action = s.seenRole[pid] ? `<div class="panel"><p>Gleich geht's los. Warte auf die erste Runde.</p></div>` : `<div class="panel stack"><p>Schau dir deine Rolle an, ohne dass andere mitlesen.</p><button class="primary big" data-a="seen">Gesehen</button></div>`;
  else if (s.phase === 'nominate' && isPres) {
    action = `<div class="panel stack"><h2>Du bist Präsident:in</h2><p>Nominiere eine Person für die Kanzlerschaft. Diskutiert vorher am Tisch.</p><div class="picks">${s.players.map((x, i) => {
      if (i === me || !x.alive) return '';
      const ok = canBeChancellor(s, i);
      return `<button data-a="nominate" data-v="${i}" ${ok ? '' : 'disabled'}>${esc(x.name)}${ok ? '' : '<small>Amtszeitsperre</small>'}</button>`;
    }).join('')}</div></div>`;
  } else if (s.phase === 'vote') {
    const v = s.votes[pid];
    action = `<div class="panel stack"><h2>Abstimmung</h2><p>Soll <b>${nm(s, s.presIdx)}</b> als Präsident:in mit <b>${nm(s, s.chanIdx)}</b> als Kanzler:in regieren?</p>

      <p class="muted">${v === undefined ? 'Deine Stimme bleibt bis zur Auszählung geheim.' : 'Abgegeben. Du kannst bis zur Auszählung noch wechseln.'}</p></div>`;
  } else if (s.phase === 'pres_discard' && isPres) {
    action = `<div class="panel stack"><h2>Ein Gesetz ablegen</h2><p>Tippe das Gesetz an, das du <b>verdeckt ablegen</b> willst. Die anderen zwei gehen an ${nm(s, s.chanIdx)}.</p><div class="hand">${s.hand.map((c, i) => `<button data-a="discard" data-v="${i}" aria-label="${c === 'L' ? t.polL : t.polF} ablegen">${card(c, s)}</button>`).join('')}</div><p class="muted" style="font-size:.85rem">Du darfst später behaupten, was du willst. Lügen ist erlaubt.</p></div>`;
  } else if (s.phase === 'chan_enact' && isChan) {
    action = `<div class="panel stack"><h2>Ein Gesetz erlassen</h2><p>Tippe das Gesetz an, das du <b>erlassen</b> willst. Das andere wird verdeckt abgelegt.</p><div class="hand two">${s.hand.map((c, i) => `<button data-a="enact" data-v="${i}" aria-label="${c === 'L' ? t.polL : t.polF} erlassen">${card(c, s)}</button>`).join('')}</div>
      ${s.fas >= 5 && !s.vetoDenied ? `<button class="ghost" data-a="veto_request">Veto vorschlagen (beide verwerfen)</button>` : ''}</div>`;
  } else if (s.phase === 'veto' && isPres) {
    action = `<div class="panel stack"><h2>Veto?</h2><p>${nm(s, s.chanIdx)} möchte beide Gesetze verwerfen. Stimmst du zu, rückt der Wahlticker um eins vor.</p><div class="row"><button class="ja" data-a="veto_answer" data-v="1">Zustimmen</button><button class="nein" data-a="veto_answer" data-v="0">Ablehnen</button></div></div>`;
  } else if (s.phase === 'power' && isPres) {
    if (s.power === 'peek') {
      const last = (s.secret[pid] || []).filter(m => m.type === 'peek').pop();
      action = `<div class="panel stack"><h2>Gesetze ansehen</h2><p>Die obersten drei Karten des Stapels (in dieser Reihenfolge):</p><div class="hand">${last ? last.cards.map(c => `<div>${card(c, s)}</div>`).join('') : ''}</div><button class="primary" data-a="peek_done">Gesehen, weiter</button></div>`;
    } else {
      const verb = { investigate: ['Gesinnung prüfen', 'Wessen Parteizugehörigkeit willst du sehen? Du darfst das Ergebnis teilen oder lügen.'], special: ['Sonderwahl', 'Wer wird nächste:r Präsident:in? Danach geht es reihum bei deiner linken Nachbarschaft weiter.'], kill: ['Hinrichtung', 'Wen lässt du hinrichten? Die Person scheidet aus und darf ihre Rolle nicht verraten.'] }[s.power];
      action = `<div class="panel stack"><h2>${verb[0]}</h2><p>${verb[1]}</p><div class="picks">${s.players.map((x, i) => {
        if (i === me || !x.alive) return '';
        const ok = !(s.power === 'investigate' && x.investigated);
        return `<button data-a="${s.power}" data-v="${i}" ${ok ? '' : 'disabled'}>${esc(x.name)}${ok ? '' : '<small>schon geprüft</small>'}</button>`;
      }).join('')}</div></div>`;
    }
  } else {
    action = `<div class="status"><span class="lbl">${h}</span><p>${txt}</p></div>`;
  }
  const secrets = (s.secret[pid] || []).filter(m => m.type === 'inv').map(m => `<p class="note">Runde ${m.round}: <b>${nm(s, m.target)}</b> gehört zur Partei <b style="color:${m.party === 'L' ? 'var(--lib)' : 'var(--fas)'}">${m.party === 'L' ? t.Ls : t.Fs}</b>.</p>`).join('');
  const roleSec = s.phase === 'lobby' ? '' : (app.showRole || s.phase === 'roles' && !s.seenRole[pid] || s.phase === 'over')
    ? `${roleBox(s, me)}${s.phase !== 'over' && !(s.phase === 'roles' && !s.seenRole[pid]) ? '<button class="ghost" data-a="role">Rolle verdecken</button>' : ''}`
    : `<button class="ghost" data-a="role">Meine Rolle zeigen</button>`;
  return `<div class="phone stack">${head}${err}${pending}${action}${secrets ? `<div class="stack"><span class="lbl">Nur für dich</span>${secrets}</div>` : ''}${roleSec}
    ${s.phase !== 'lobby' ? `<details class="panel"><summary class="lbl" style="cursor:pointer">Spielfeld &amp; Mitspielende</summary><div class="stack" style="margin-top:12px">${tracks(s, true)}${seats(s)}</div></details>` : ''}
    </div>`;
}

// ===== Rendern =====
function render() {
  const keep = {}; document.querySelectorAll('input[id]').forEach(i => keep[i.id] = i.value);
  const focus = document.activeElement && document.activeElement.id;
  const logEl = document.getElementById('log'), logTop = logEl ? logEl.scrollTop : 0;
  let html = '';
  const s = app.s;
  if (app.view === 'home') html = homeView();
  else if (app.view === 'localsetup') html = localSetupView();
  else if (app.view === 'board') html = boardView(s);
  else if (app.view === 'player') html = playerView(s, app.handTo || myId);
  else if (app.view === 'cover') html = coverView(s, app.handTo);
  $app.innerHTML = html + footer;
  for (const k in keep) { const el = document.getElementById(k); if (el && keep[k] !== undefined) el.value = keep[k]; }
  if (focus) { const el = document.getElementById(focus); if (el) el.focus(); }
  const nl = document.getElementById('log'); if (nl) nl.scrollTop = logTop;
}

// ===== Netzwerk (PeerJS, direkt zwischen Geräten) =====
const PREFIX = 'shklassenraum26-';
const PEER_OPTS = window.SH_PEER_OPTS || { debug: 0 };
let peer = null, hostConn = null, retryT = null;
const conns = new Map();

function redact(s, pid) {
  const r = JSON.parse(JSON.stringify(s));
  const me = s.players.find(p => p.id === pid);
  if (s.phase !== 'over') {
    r.players.forEach(p => {
      if (p.id === pid) return;
      const knows = me && me.role && (me.role === 'F' && (p.role === 'F' || p.role === 'H') || me.role === 'H' && s.n0 <= 6 && p.role === 'F');
      if (!knows) p.role = null;
    });
    if (me && me.role === undefined) r.players.forEach(p => p.role = null);
  }
  r.deck = s.deck.map(() => 'X'); r.discard = s.discard.map(() => 'X');
  const pi = idxOf(s, pid);
  const handOwner = s.phase === 'pres_discard' || s.phase === 'veto' ? s.presIdx : s.phase === 'chan_enact' ? s.chanIdx : -2;
  if (pi !== handOwner) r.hand = s.hand.map(() => 'X');
  if (s.phase === 'vote') for (const k in r.votes) if (k !== pid) r.votes[k] = null;
  r.secret = { [pid]: s.secret[pid] || [] };
  return r;
}

function hostOpen(code, attempt = 0) {
  if (peer) try { peer.destroy(); } catch (e) {}
  app.net = 'wait';
  peer = new Peer(PREFIX + code, PEER_OPTS);
  peer.on('open', () => { app.net = 'ok'; app.msg = ''; render(); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') {
      if (app.s && app.s.phase === 'lobby' && !app.s.players.length && attempt < 3) { const c = genCode(); app.code = c; app.s.code = c; saveLocal(); return hostOpen(c, attempt + 1); }
      if (attempt < 6) { app.msg = 'Code ist noch belegt, neuer Versuch …'; render(); return setTimeout(() => hostOpen(code, attempt + 1), 4000); }
    }
    if (e.type === 'peer-unavailable') return;
    app.net = 'err'; app.msg = 'Verbindungsproblem (' + e.type + '). Prüfe die Internetverbindung.'; render();
  });
  peer.on('disconnected', () => { app.net = 'err'; render(); setTimeout(() => { try { if (peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 2000); });
  peer.on('connection', c => {
    c.on('data', d => onHostData(c, d));
    c.on('close', () => { for (const [k, v] of conns) if (v === c) conns.delete(k); render(); });
  });
}
function onHostData(c, d) {
  if (!d || !d.pid || !app.s) return;
  conns.set(d.pid, c);
  if (d.type === 'hello') { sendState(d.pid); render(); return; }
  if (d.type === 'act') {
    const s = app.s;
    if (d.n <= (s.seen[d.pid] || 0)) return sendState(d.pid);
    s.seen[d.pid] = d.n;
    let a = d.a; if (!a || typeof a !== 'object') return;
    const err = apply(s, d.pid, a);
    s.err = err ? { pid: d.pid, n: d.n, text: err } : null;
    changed();
  }
}
function sendState(pid) { const c = conns.get(pid); if (c && c.open) try { c.send({ type: 'state', s: redact(app.s, pid) }); } catch (e) {} }
function broadcast() { for (const pid of conns.keys()) sendState(pid); }
function saveLocal() { if (app.mode === 'online' && app.role === 'host') LS.set('hoststate', app.s); }
function changed() { if (app.mode === 'online' && app.role === 'host') { broadcast(); saveLocal(); scheduleBots(); } render(); }

// Spieler:in
function playerOpen() {
  clearTimeout(retryT);
  if (peer) try { peer.destroy(); } catch (e) {}
  app.net = 'wait';
  peer = new Peer(undefined, PEER_OPTS);
  peer.on('open', () => connectHost());
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') { app.net = 'nohost'; render(); retry(3000); return; }
    app.net = 'err'; render(); clearTimeout(retryT); retryT = setTimeout(playerOpen, 4000);
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
}
function retry(ms) { clearTimeout(retryT); retryT = setTimeout(connectHost, ms); }
function connectHost() {
  if (app.role !== 'player') return;
  if (!peer || peer.destroyed) return playerOpen();
  if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} return retry(2000); }
  const c = peer.connect(PREFIX + app.code, { reliable: true });
  hostConn = c;
  c.on('open', () => {
    if (hostConn !== c) return;
    app.net = 'ok';
    c.send({ type: 'hello', pid: myId });
    if (app.joinName) { sendAct({ type: 'join', name: app.joinName }); }
    render();
  });
  c.on('data', d => {
    if (!d || d.type !== 'state') return;
    app.s = d.s;
    if ((app.s.seen[myId] || 0) > app.n) app.n = app.s.seen[myId];
    if (idxOf(app.s, myId) >= 0) app.joinName = null;
    app.view = 'player'; render();
  });
  c.on('close', () => { if (hostConn === c && app.role === 'player') { app.net = 'lost'; render(); retry(2000); } });
}
function sendAct(a) {
  app.n = Math.max(app.n, (app.s && app.s.seen[myId]) || 0) + 1;
  if (hostConn && hostConn.open) { try { hostConn.send({ type: 'act', pid: myId, n: app.n, a }); } catch (e) {} }
  else app.msg = 'Keine Verbindung zur Tafel. Es wird neu verbunden …';
  render();
}

// ===== Testspieler:innen =====
let botT = null;
function botAction(s, pid) {
  const me = idxOf(s, pid), p = s.players[me], bad = p.role !== 'L';
  const others = s.players.map((x, i) => i).filter(i => i !== me && s.players[i].alive);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  switch (s.phase) {
    case 'roles': return { type: 'seen' };
    case 'nominate': return { type: 'nominate', target: pick(others.filter(i => canBeChancellor(s, i))) };
    case 'vote': return { type: 'vote', ja: Math.random() < 0.65 };
    case 'pres_discard': { let i = s.hand.indexOf(bad ? 'L' : 'F'); if (i < 0 || Math.random() < 0.2) i = Math.floor(Math.random() * s.hand.length); return { type: 'discard', i }; }
    case 'chan_enact': { let i = s.hand.indexOf(bad ? 'F' : 'L'); return { type: 'enact', i: i < 0 ? 0 : i }; }
    case 'veto': return { type: 'veto_answer', ok: Math.random() < 0.5 };
    case 'power': if (s.power === 'peek') return { type: 'peek_done' };
      return { type: s.power, target: pick(s.power === 'investigate' ? others.filter(i => !s.players[i].investigated) : others) };
  }
  return null;
}
function scheduleBots() {
  clearTimeout(botT);
  const s = app.s;
  if (!s || !app.autoBots || app.role !== 'host' || app.mode !== 'online' || s.phase === 'over' || s.phase === 'lobby') return;
  const bot = actors(s).map(id => s.players.find(p => p.id === id)).find(p => p && p.bot);
  if (!bot) return;
  botT = setTimeout(() => {
    if (app.s !== s || !actors(s).includes(bot.id)) return;
    const a = botAction(s, bot.id); if (a) apply(s, bot.id, a);
    changed();
  }, s.phase === 'vote' || s.phase === 'roles' ? 450 : 1100);
}

// ===== Aktionen =====
function send(a) {
  if (app.handTo) {
    const err = apply(app.s, app.handTo, a);
    app.s.err = err ? { pid: app.handTo, n: app.n, text: err } : null;
    if (!err && a.type !== 'investigate') { app.view = 'board'; app.handTo = null; app.showRole = false; }
    changed(); return;
  }
  sendAct(a);
}
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; }
function resetApp() {
  clearTimeout(retryT); clearTimeout(botT);
  if (peer) try { peer.destroy(); } catch (e) {}
  peer = null; hostConn = null; conns.clear();
  try { sessionStorage.removeItem('sh_live'); } catch (e) {}
  Object.assign(app, { view: 'home', mode: null, role: null, s: null, code: null, handTo: null, showRole: false, joinName: null, net: null });
}
function startPlayer(code, pid, name) {
  myId = pid; try { sessionStorage.setItem('sh_pid', pid); sessionStorage.setItem('sh_live', code); } catch (e) {}
  LS.set('session', { code, pid, name });
  app.mode = 'online'; app.role = 'player'; app.code = code; app.n = 0; app.joinName = name;
  app.s = newGame(code, '', 'orig'); app.view = 'player';
  playerOpen(); render();
}

// ===== Ereignisse =====
$app.addEventListener('change', e => { if (e.target.id === 'in-auto') { app.autoBots = e.target.checked; scheduleBots(); render(); } });
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v, s = app.s;
  if (a === 'auto') return;
  app.msg = '';
  switch (a) {
    case 'hterms': app.terms = v; render(); break;
    case 'terms': s.terms = v; changed(); break;
    case 'host': {
      const code = genCode();
      resetApp();
      app.mode = 'online'; app.role = 'host'; app.code = code; app.s = newGame(code, myId, app.terms); app.view = 'board';
      saveLocal(); hostOpen(code); render(); break;
    }
    case 'resume': {
      const hs = LS.get('hoststate'); if (!hs) break;
      resetApp(); app.mode = 'online'; app.role = 'host'; app.code = hs.code; app.s = hs; app.view = 'board';
      hostOpen(hs.code); scheduleBots(); render(); break;
    }
    case 'join': {
      const code = (document.getElementById('in-code').value || '').trim().toUpperCase(), name = (document.getElementById('in-name').value || '').trim().slice(0, 18);
      if (!/^[A-Z]{4}$/.test(code)) { app.msg = 'Der Code besteht aus vier Buchstaben.'; render(); break; }
      if (!name) { app.msg = 'Bitte einen Namen eingeben.'; render(); break; }
      LS.set('name', name); LS.set('lastcode', code);
      resetApp();
      const old = LS.get('session');
      startPlayer(code, old && old.code === code && old.pid === myId ? old.pid : 'p' + Math.random().toString(36).slice(2, 10), name); break;
    }
    case 'rejoin': { const ps = LS.get('session'); if (!ps) break; resetApp(); startPlayer(ps.code, ps.pid, ps.name); app.joinName = null; break; }
    case 'start': try { startGame(s); s.err = null; } catch (err) { app.msg = err.message; } changed(); break;
    case 'begin': beginRounds(s); changed(); break;
    case 'kick': s.players.splice(+v, 1); changed(); break;
    case 'addbot': {
      let k = 1; while (s.players.some(p => p.name === 'Test ' + k)) k++;
      s.players.push({ id: 'bot' + Math.random().toString(36).slice(2, 8), name: 'Test ' + k, alive: true, bot: true }); changed(); break;
    }
    case 'again': {
      const keep = s.players.map(p => ({ id: p.id, name: p.name, alive: true, bot: p.bot }));
      const ns = newGame(s.code, s.hostId, s.terms); ns.players = keep; ns.seen = s.seen; app.s = ns;
      if (app.mode === 'local') startGame(ns);
      changed(); break;
    }
    case 'quit': {
      if (app.role === 'host' && app.mode === 'online') LS.set('hoststate', null);
      if (app.role === 'player') LS.set('session', null);
      resetApp(); render(); break;
    }
    case 'leave': sendAct({ type: 'leave' }); LS.set('session', null); setTimeout(() => { resetApp(); render(); }, 400); break;
    case 'role': app.showRole = !app.showRole; render(); break;
    case 'seen': app.showRole = false; send({ type: 'seen' }); break;
    case 'nominate': case 'investigate': case 'special': case 'kill': send({ type: a, target: +v }); break;
    case 'vote': send({ type: 'vote', ja: v === '1' }); break;
    case 'discard': case 'enact': send({ type: a, i: +v }); break;
    case 'veto_request': case 'peek_done': send({ type: a }); break;
    case 'veto_answer': send({ type: a, ok: v === '1' }); break;
    case 'localsetup': app.view = 'localsetup'; render(); break;
    case 'ladd': { const el = document.getElementById('in-lname'); const x = (el.value || '').trim().slice(0, 18); if (x && app.localNames.length < 10 && !app.localNames.includes(x)) app.localNames.push(x); el.value = ''; render(); document.getElementById('in-lname')?.focus(); break; }
    case 'ldel': app.localNames.splice(+v, 1); render(); break;
    case 'lstart': {
      const ns = newGame('LOKAL', 'local', app.terms); ns.players = app.localNames.map((x, i) => ({ id: 'L' + i, name: x, alive: true }));
      startGame(ns); app.s = ns; app.mode = 'local'; app.role = 'host'; app.view = 'board'; render(); break;
    }
    case 'handto': app.handTo = v; app.view = app.mode === 'local' ? 'cover' : 'player'; app.showRole = false; render(); break;
    case 'open': app.view = 'player'; render(); break;
    case 'cover': app.view = 'board'; app.handTo = null; app.showRole = false; if (app.s) app.s.err = null; render(); break;
  }
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'in-lname') $app.querySelector('[data-a="ladd"]').click();
  if (e.target.id === 'in-name' || e.target.id === 'in-code') $app.querySelector('[data-a="join"]').click();
});

// ===== Start =====
(function boot() {
  // Nach Neuladen im selben Tab automatisch wieder verbinden
  let live = null; try { live = sessionStorage.getItem('sh_live'); } catch (e) {}
  const ps = LS.get('session');
  if (live && ps && ps.code === live && typeof Peer !== 'undefined') { startPlayer(ps.code, ps.pid, ps.name); app.joinName = null; return; }
  render();
})();
</script>
